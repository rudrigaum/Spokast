excluded:
  - Pods
  - DerivedData
  - SpokastTests/Mocks
  - Fastlane

opt_in_rules:
  - empty_count
  - force_unwrapping
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - todo

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 1000

custom_rules:
  unused_parameter:
    name: "Unused Parameter"
    regex: '(?<=\W)(coder|controller|collectionView)\s*:(?!\s*_)'
    message: "Prefira usar '_' para parâmetros de protocolo/delegate não utilizados (ex: init(coder _: NSCoder))."
    severity: warning
